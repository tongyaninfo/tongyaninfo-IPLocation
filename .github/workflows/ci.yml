name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端构建与测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 还原本地工具
        run: dotnet tool restore

      - name: 构建
        run: dotnet build backend/IpLocation.slnx --nologo -p:UseSharedCompilation=false -m:1 -nr:false

      - name: 测试
        env:
          # 测试环境强制关闭产品安装心跳，避免向官方服务注册测试安装或污染统计。
          Support__TelemetryEnabled: "false"
        run: dotnet test backend/tests/IpLocation.Api.Tests/IpLocation.Api.Tests.csproj --nologo -p:UseSharedCompilation=false -m:1 -nr:false

      - name: 离线迁移 SQL 一致性
        run: node scripts/verify-migrations.mjs

  frontend:
    name: 前端构建与测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 测试
        run: npm test

      - name: 构建
        run: npm run build

  docs:
    name: 文档与链接检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 检查文档
        run: node scripts/verify.mjs --scope docs

  sensitive-scan:
    name: 敏感信息扫描
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 扫描敏感信息
        run: node scripts/scan-open-source-sensitive.mjs --root .
